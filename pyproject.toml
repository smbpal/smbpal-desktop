[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smbpal"
version = "0.2.6"
description = "SMB share manager — daemon, CLI and GUI in one package"
requires-python = ">=3.11"

# The classifier rather than PEP 639's `license = "GPL-3.0-or-later"`, which
# needs setuptools 77 or newer. The package is built by pybuild against
# whichever setuptools the distribution ships, and CI builds on an older one
# than Trixie — so the SPDX field would be a build failure that only appears
# on some machines. The classifier is understood everywhere. The licence
# itself is stated in LICENSE and in debian/copyright.
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

# Deliberately empty, and it should stay that way for the daemon and CLI.
# D11: system Python, depend don't bundle. The GUI's PyGObject and GTK4 arrive
# as Debian packages (python3-gi, gir1.2-gtk-4.0), not from PyPI, because a
# GTK binding installed by pip against a different GTK is how you get a
# process that imports and then segfaults.
dependencies = []

[project.scripts]
smbpal = "smbpal.cli.main:main"
smbpald = "smbpal.daemon.main:main"
# Imports gi, so it is the one entry point that needs python3-gi and
# gir1.2-gtk-4.0 installed. Nothing the daemon or the CLI runs touches it.
smbpal-gui = "smbpal.gui.app:main"
# macOS only, and it says so rather than failing oddly when it is not. D13:
# mounting there needs no elevation and the login Keychain is unreadable from
# root, so it cannot live in smbpald. On Linux it refuses and names what does.
smbpal-agent = "smbpal.agent.main:main"
# Gio and GLib only — never Gtk. The tray is a long-lived session process (3g)
# and loading a toolkit into it would be paying for a window it never opens.
smbpal-tray = "smbpal.gui.tray:main"

[tool.setuptools.packages.find]
include = ["smbpal*"]
