<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Something needs a person. **The badge is a shape, not a colour**, and
       that is deliberate: a panel may render a tray icon into a monochrome
       theme, and an icon whose only distinguishing feature was red would then
       be identical to the healthy one. Same rule as the window, where `idle`
       is its own tone rather than a shade of green. -->
  <g fill="none" stroke="#e01b24" stroke-width="1.5" stroke-linecap="round">
    <path d="M3.4 6.6a5 5 0 0 1 9.2 0"/>
  </g>
  <circle cx="8" cy="6.4" r="1.15" fill="#e01b24"/>
  <rect x="1.6" y="9.2" width="12.8" height="5.4" rx="1.4" fill="#e01b24"/>
  <circle cx="12.6" cy="12" r="3.1" fill="#ffffff"/>
  <rect x="11.95" y="9.9" width="1.3" height="2.5" rx="0.65" fill="#e01b24"/>
  <circle cx="12.6" cy="13.5" r="0.8" fill="#e01b24"/>
</svg>
